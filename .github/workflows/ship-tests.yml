name: ship tests

# The engine suite claims to be hermetic — no network, no `gh`, no remote.
# A claim like that decays silently: someone adds one convenient live call, the
# suite still passes on a developer machine, and the first CI run without
# credentials is where it surfaces. So the job below removes the network for
# the engine suite rather than trusting the claim.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: engine (python, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.9 is the declared floor. Testing only on the newest version would
          # let a 3.10+ syntax or stdlib addition through unnoticed.
          python-version: ${{ matrix.python-version }}

      - name: Report the tool versions actually under test
        run: |
          python3 --version
          git --version
          gh --version || echo "gh is absent — the engine suite must not need it"

      - name: Run the engine suite with the network removed
        # `unshare -rn` drops the process into a new network namespace with no
        # interfaces. Any test that reaches for the network fails here rather
        # than in someone's first real run.
        run: |
          unshare -rn bash .specify/extensions/ship/tests/run.sh

      - name: Assert no production module can reach the recorded test double
        run: |
          python3 -m unittest \
            tests.contract.test_no_fake_in_production \
            --verbose
        working-directory: .specify/extensions/ship
        env:
          PYTHONPATH: ${{ github.workspace }}/.specify/extensions/ship

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

  separability:
    name: separability (FR-042, both directions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editor/ship-view/package-lock.json

      - run: npm --prefix editor/ship-view ci

      - name: The pipeline works with no view, and the view degrades with no pipeline
        run: bash .specify/extensions/ship/tests/integration/test_separability.sh

  view:
    name: view (typescript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/ship-view
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editor/ship-view/package-lock.json
      - uses: actions/setup-python@v5
        with:
          # The validator-parity tests shell out to the real Python validator.
          # Two validators that agree only with themselves are worth nothing.
          python-version: "3.12"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  install:
    name: install is idempotent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install, then install again and require no further change
        run: |
          python3 .specify/extensions/ship/scripts/install.py
          second=$(python3 .specify/extensions/ship/scripts/install.py)
          echo "$second"
          if ! grep -q "nothing to do — already installed" <<<"$second"; then
            echo "::error::install.py is not idempotent — the second run changed something"
            exit 1
          fi

      - name: The working tree is unchanged by a repeat install
        run: git diff --exit-code
